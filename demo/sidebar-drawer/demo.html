<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Sidebar with Overlay</title>
    <style type="text/css">
      /* Basic reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body styling */
body {
    font-family: Arial, sans-serif;
}

/* Sidebar styling */
.sidebar {
    position: fixed;
    top: 0;
    right: 0;
    width: 320px;
    height: 100vh;
    background-color: #f9f9f9;
    box-shadow: -2px 0 5px rgba(0, 0, 0, 0.5);
    overflow-y: auto;
    transform: translateX(100%); /* Start off-screen to the right */
    transition: transform 0.3s ease; /* Add transition for the transform property */
    z-index: 1000;
}

/* Overlay styling */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
    visibility: hidden; /* Hidden by default */
    opacity: 0;
    transition: opacity 0.3s ease; /* Add transition for smooth appearance */
    z-index: 900; /* Place it behind the sidebar */
}

/* When overlay is visible */
.overlay.visible {
    visibility: visible;
    opacity: 1;
}

/* Main content */
#main-content {
    padding: 20px;
}

/* When the sidebar is open */
.sidebar.open {
    transform: translateX(0); /* Slide in to its original position */
}

/* Accessibility: Hidden state (Use visibility and opacity instead of display to keep element in the flow) */
[aria-hidden="true"] {
    visibility: hidden;
    opacity: 0;
}
[aria-hidden="false"] {
    visibility: visible;
    opacity: 1;
}

    </style>
</head>
<body>
    <button id="open-sidebar" aria-expanded="false" aria-controls="sidebar" aria-label="Open sidebar">Open Sidebar</button>

    <!-- Sidebar with data-overlay attribute -->
    <div id="sidebar" class="sidebar" role="dialog" aria-modal="true" aria-hidden="true" data-overlay="true">
        <button id="close-sidebar" aria-label="Close sidebar">Close</button>
        <h2>Sidebar Content</h2>
        <p>This is a sidebar that provides additional information or form inputs.</p>
        <!-- Additional content can be added here -->
    </div>

    <!-- Overlay -->
    <div id="overlay" class="overlay" aria-hidden="true"></div>

    <div id="main-content">
        <h1>Main Content</h1>
        <p>This is the main content of the page.</p>
    </div>

    <script type="text/javascript">
      const openButton = document.getElementById('open-sidebar');
const closeButton = document.getElementById('close-sidebar');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

openButton.addEventListener('click', () => {
    sidebar.classList.add('open');
    sidebar.setAttribute('aria-hidden', 'false');
    openButton.setAttribute('aria-expanded', 'true');

    // Check if overlay is needed based on data-overlay attribute
    if (sidebar.getAttribute('data-overlay') === 'true') {
        overlay.classList.add('visible');
        overlay.setAttribute('aria-hidden', 'false');
    }

    sidebar.focus(); // Set focus to the sidebar for accessibility
});

closeButton.addEventListener('click', closeSidebar);

// Close sidebar when pressing 'Escape' key
document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && sidebar.classList.contains('open')) {
        closeSidebar();
    }
});

// Close sidebar when clicking on the overlay
overlay.addEventListener('click', closeSidebar);

function closeSidebar() {
    sidebar.classList.remove('open');
    openButton.setAttribute('aria-expanded', 'false');

    // Remove overlay visibility
    overlay.classList.remove('visible');
    overlay.setAttribute('aria-hidden', 'true');

    // Delay the aria-hidden attribute change to ensure animation completes
    setTimeout(() => {
        sidebar.setAttribute('aria-hidden', 'true');
        openButton.focus(); // Return focus to the button
    }, 300); // Match the duration of the CSS transition
}

    </script>
</body>
</html>
